name: opsproof-observability

services:
  prometheus:
    entrypoint: ["/usr/bin/prometheus"]
    image: ghcr.io/quenchworks/images/prometheus@sha256:1783da450273bb51d42e604b105739e55961b70b74553975344c81ecfa150786
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB

    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - type: volume
        source: prometheus-data
        target: /prometheus
        volume:
          nocopy: true

    ports:
      - "127.0.0.1:9090:9090"

    networks:
      - opsproof-telemetry

    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped

  alertmanager:
    entrypoint: ["/usr/bin/alertmanager"]
    image: ghcr.io/quenchworks/images/alertmanager@sha256:4d51bc7dea8c47c931075d2f67bc70bd5686aac6589701001f457e03747c6615
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.runtime/observability/webhook-token:/etc/alertmanager/webhook-token:ro
      - type: volume
        source: alertmanager-data
        target: /alertmanager
        volume:
          nocopy: true

    ports:
      - "127.0.0.1:9093:9093"

    networks:
      - opsproof-telemetry

    mem_limit: 128m
    stop_grace_period: 60s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    command:
      - --config=/etc/otelcol/config.yaml

    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
      - type: volume
        source: collector-data
        target: /var/lib/otelcol
        volume:
          nocopy: true

    networks:
      - opsproof-telemetry

    mem_limit: 256m
    stop_grace_period: 60s
    restart: unless-stopped

  loki:
    image: grafana/loki@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    command:
      - -config.file=/etc/loki/local.yaml

    volumes:
      - ./observability/loki.yml:/etc/loki/local.yaml:ro
      - type: volume
        source: loki-data
        target: /loki
        volume:
          nocopy: true

    ports:
      - "127.0.0.1:3100:3100"

    networks:
      - opsproof-telemetry

    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped

  tempo:
    image: ghcr.io/quenchworks/images/tempo@sha256:eba09e226f8ac6874bed9237832e1b3b35ea5083a2d981741e5b18aa306a88cf
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    command:
      - -config.file=/etc/tempo/config.yaml

    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yaml:ro
      - type: volume
        source: tempo-data
        target: /var/tempo
        volume:
          nocopy: true

    ports:
      - "127.0.0.1:3200:3200"

    networks:
      - opsproof-telemetry

    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped

  grafana:
    build: ./observability/grafana
    image: opsproof-grafana:local
    user: "472:472"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432"]

    environment:
      GF_SECURITY_ADMIN_USER: opsproof
      GF_SECURITY_ADMIN_PASSWORD: "${OPSPROOF_GRAFANA_ADMIN_PASSWORD:?Set Grafana password}"
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/lib/grafana/log
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
      GF_PATHS_HOME: /usr/share/grafana
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
        volume:
          nocopy: true
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - opsproof-telemetry

    mem_limit: 512m
    stop_grace_period: 60s
    restart: unless-stopped

networks:
  opsproof-telemetry:
    external: true
    name: opsproof-telemetry

volumes:
  collector-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
