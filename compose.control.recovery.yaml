# Optional recovery and model comparison; both disabled by default.
services:
  control-api:
    environment:
      OPSPROOF_CONTROL_RECOVERY_ENABLED: "${OPSPROOF_CONTROL_RECOVERY_ENABLED:-false}"
      OPSPROOF_CONTROL_AI_ENABLED: "${OPSPROOF_CONTROL_AI_ENABLED:-false}"
      OPSPROOF_CONTROL_AI_DAILY_LIMIT: "${OPSPROOF_CONTROL_AI_DAILY_LIMIT:-10}"
      OPSPROOF_CONTROL_AI_PROVIDER: "${OPSPROOF_CONTROL_AI_PROVIDER:-nvidia}"
  evidence-worker:
    environment:
      OPSPROOF_CONTROL_INSPECTION_KEY: "${OPSPROOF_INSPECTION_KEY:?Prepare inspection key}"
      OPSPROOF_CONTROL_PROMETHEUS_URL: "http://prometheus:9090"
      OPSPROOF_CONTROL_AI_ENABLED: "${OPSPROOF_CONTROL_AI_ENABLED:-false}"
      OPSPROOF_CONTROL_AI_PROVIDER: "${OPSPROOF_CONTROL_AI_PROVIDER:-nvidia}"
      OPSPROOF_CONTROL_AI_MODEL: "${OPSPROOF_CONTROL_AI_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}"
      OPSPROOF_CONTROL_AI_API_KEY: "${OPSPROOF_CONTROL_AI_API_KEY:-}"
  action-worker:
    environment:
      OPSPROOF_CONTROL_INSPECTION_KEY: "${OPSPROOF_INSPECTION_KEY:?Prepare inspection key}"
      OPSPROOF_CONTROL_RECOVERY_KEY: "${OPSPROOF_RECOVERY_KEY:?Prepare recovery key}"
      OPSPROOF_CONTROL_RECOVERY_ENABLED: "${OPSPROOF_CONTROL_RECOVERY_ENABLED:-false}"
