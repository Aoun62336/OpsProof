[project]
name = "opsproof-control"
version = "0.1.0"
description = "Policy-controlled OpsProof experiment and evidence services"
requires-python = ">=3.14,<3.15"

dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.120,<1",
  "httpx2>=2,<3",
  "opentelemetry-distro>=0.63b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
  "opentelemetry-instrumentation-fastapi>=0.63b0,<1",
  "opentelemetry-instrumentation-logging>=0.63b0,<1",
  "prometheus-client>=0.23,<1",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic-settings>=2.10,<3",
  "redis>=7,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsproof_control"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
