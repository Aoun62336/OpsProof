server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-store" always;
    location = /healthz { default_type text/plain; return 200 "healthy\n"; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location / { return 404; }
}
