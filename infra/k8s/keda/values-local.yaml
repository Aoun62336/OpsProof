# kedacore/keda 2.21.0, bounded demo-only scaler scope.
watchNamespace: opsproof-demo
rbac:
  enabledCustomScaledRefKinds: false
  aggregateToDefaultRoles: false
permissions:
  operator:
    restrict:
      secret: true
  metricServer:
    restrict:
      secret: true
resources:
  operator:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 400m, memory: 256Mi}
  metricServer:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 400m, memory: 256Mi}
  webhooks:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {cpu: 200m, memory: 128Mi}
