apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: opsproof-worker-recovery, namespace: opsproof-demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo-worker]
    verbs: [get, patch]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    resourceNames: [demo-worker-lag]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: opsproof-worker-recovery, namespace: opsproof-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: opsproof-worker-recovery}
subjects: [{kind: ServiceAccount, name: control-action, namespace: opsproof-control}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: opsproof-worker-evidence, namespace: opsproof-demo}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [demo-worker]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: opsproof-worker-evidence, namespace: opsproof-demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: opsproof-worker-evidence}
subjects: [{kind: ServiceAccount, name: control-evidence, namespace: opsproof-control}]
