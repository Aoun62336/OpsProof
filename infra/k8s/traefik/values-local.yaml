# Traefik Helm chart version 42.3.0. Requires pinned Gateway API CRDs.
# Only a local k3d node port is reachable at 127.0.0.1:8081.
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    experimentalChannel: false

gatewayClass:
  enabled: true
  name: traefik

gateway:
  enabled: true
  name: opsproof-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: Selector
        selector:
          matchLabels:
            app.kubernetes.io/part-of: opsproof

service:
  spec:
    type: NodePort
ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30080
  websecure:
    expose:
      default: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false

ingressRoute:
  dashboard:
    enabled: false

accessLog:
  enabled: false

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 192Mi}
