# External Secrets Operator uses EKS Pod Identity bound to its ServiceAccount.
# No AWS key material belongs in this file.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: opsproof-aws-sm
  namespace: opsproof-control
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
