replicaCount: 1
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 200m, memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
certController:
  rbac:
    create: false
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

# Only the control namespace consumes cloud Secrets Manager data.
scopedNamespace: opsproof-control
scopedRBAC: true
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterStore: false
processClusterGenerator: false
processPushSecret: false
rbac:
  serviceAccountTokenCreate: false

# The upstream certificate controller disables Secret caching and GETs its named
# webhook Secret. Keep only CRD/webhook discovery cluster-wide; certificate,
# endpoint readiness and leader-election permissions belong to its own namespace.
# Reviewed against external-secrets v2.15.0 cmd/controller/certcontroller.go and
# pkg/controllers/crds/crds_controller.go. Live readiness remains an owner gate.
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
    rules:
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        verbs: [get, list, watch]
      - apiGroups: [apiextensions.k8s.io]
        resources: [customresourcedefinitions]
        resourceNames: [externalsecrets.external-secrets.io, secretstores.external-secrets.io, clustersecretstores.external-secrets.io]
        verbs: [update, patch]
      - apiGroups: [admissionregistration.k8s.io]
        resources: [validatingwebhookconfigurations]
        verbs: [get, list, watch]
      - apiGroups: [admissionregistration.k8s.io]
        resources: [validatingwebhookconfigurations]
        resourceNames: [secretstore-validate, externalsecret-validate]
        verbs: [update, patch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
    subjects:
      - kind: ServiceAccount
        name: '{{ include "external-secrets-cert-controller.serviceAccountName" . }}'
        namespace: '{{ .Release.Namespace }}'
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
      namespace: '{{ .Release.Namespace }}'
    rules:
      - apiGroups: [""]
        resources: [secrets]
        resourceNames: ['{{ include "external-secrets.fullname" . }}-webhook']
        verbs: [get, update, patch]
      - apiGroups: [""]
        resources: [endpoints]
        verbs: [get, list, watch]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [events]
        verbs: [create, patch]
      - apiGroups: [coordination.k8s.io]
        resources: [leases]
        verbs: [get, create, update, patch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
      namespace: '{{ .Release.Namespace }}'
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: '{{ include "external-secrets.fullname" . }}-cert-controller'
    subjects:
      - kind: ServiceAccount
        name: '{{ include "external-secrets-cert-controller.serviceAccountName" . }}'
        namespace: '{{ .Release.Namespace }}'
