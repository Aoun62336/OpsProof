image:
  repository: opsproof-web
  tag: ""
  digest: "" # optional verified release digest
  pullPolicy: IfNotPresent
releaseMarker: gitops-verified
resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 200m, memory: 128Mi}

# Keep the original M5 Gateway API route by default. EKS smoke disables it
# because the temporary cluster does not install Gateway API controllers.
gatewayRoute:
  enabled: true
