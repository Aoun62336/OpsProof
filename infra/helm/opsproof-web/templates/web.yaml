{{- if and .Values.image.digest (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest)) -}}{{ fail "invalid image.digest" }}{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata: {name: opsproof-web}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsproof-web
  annotations:
    opsproof.io/release-marker: {{ .Values.releaseMarker | quote }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: opsproof-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opsproof-web}
    spec:
      serviceAccountName: opsproof-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository (required "image.tag required" .Values.image.tag) | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: nginx-cache
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: opsproof-web}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: opsproof-web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: opsproof-web}
spec:
  parentRefs:
    - name: opsproof-gateway
      namespace: opsproof-gateway
      sectionName: web
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: opsproof-web, port: 8080, weight: 1}
