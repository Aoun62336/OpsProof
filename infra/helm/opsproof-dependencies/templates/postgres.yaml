{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {app.kubernetes.io/name: opsproof-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: opsproof-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-postgres
  selector:
    matchLabels: {app.kubernetes.io/name: opsproof-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opsproof-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: opsproof}
            - {name: POSTGRES_DB, value: opsproof}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: opsproof-postgres-auth, key: POSTGRES_PASSWORD}
          resources:
{{- toYaml (dict "requests" .Values.postgres.requests "limits" .Values.postgres.limits) | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: postgres-run, mountPath: /var/run/postgresql}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U opsproof -d opsproof"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U opsproof -d opsproof"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: postgres-run
          emptyDir: {sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage | quote }}
{{- end }}
