apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-redis
  selector:
    matchLabels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if .Values.redis.security.enabled }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: opsproof-redis-auth, key: password}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cat > /run/redis-config/redis.conf <<'REDIS_CONFIG'
              port 0
              tls-port 6379
              tls-cert-file /run/redis-tls/tls.crt
              tls-key-file /run/redis-tls/tls.key
              tls-ca-cert-file /run/redis-tls/ca.crt
              tls-auth-clients no
              appendonly yes
              appendfsync everysec
              maxmemory 128mb
              maxmemory-policy noeviction
              REDIS_CONFIG
              printf 'requirepass %s\n' "$REDIS_PASSWORD" >> /run/redis-config/redis.conf
              exec redis-server /run/redis-config/redis.conf
          {{- else }}
          command: ["redis-server"]
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
          {{- end }}
          ports:
            - {name: redis, containerPort: 6379}
          resources:
{{ toYaml (dict "requests" .Values.redis.requests "limits" .Values.redis.limits) | indent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.redis.security.enabled }}
            - {name: redis-tls, mountPath: /run/redis-tls, readOnly: true}
            - {name: redis-config, mountPath: /run/redis-config}
            {{- end }}
          readinessProbe:
            {{- if .Values.redis.security.enabled }}
            exec:
              command: ["/bin/sh", "-ec", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli --tls --cacert /run/redis-tls/ca.crt -h {{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local ping | grep -qx PONG"]
            {{- else }}
            exec: {command: ["redis-cli", "ping"]}
            {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            {{- if .Values.redis.security.enabled }}
            exec:
              command: ["/bin/sh", "-ec", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli --tls --cacert /run/redis-tls/ca.crt -h {{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local ping | grep -qx PONG"]
            {{- else }}
            exec: {command: ["redis-cli", "ping"]}
            {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      {{- if .Values.redis.security.enabled }}
      volumes:
        - name: redis-tls
          secret:
            secretName: opsproof-redis-tls
            defaultMode: 0444
        - name: redis-config
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
      {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storage | quote }}
