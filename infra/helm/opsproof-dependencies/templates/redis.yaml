apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-redis
  selector:
    matchLabels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opsproof-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          command: ["redis-server"]
          args: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
          ports:
            - {name: redis, containerPort: 6379}
          resources:
{{ toYaml (dict "requests" .Values.redis.requests "limits" .Values.redis.limits) | indent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storage | quote }}
