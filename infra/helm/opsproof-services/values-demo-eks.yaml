component: demo
redisTls:
  enabled: true

# Bound cloud autoscaling. No cluster autoscaler can add billable nodes.
autoscaling:
  keda:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2

environment: temporary-eks

telemetry:
  enabled: true
  endpoint: http://otel-collector.opsproof-observability.svc.cluster.local:4318
