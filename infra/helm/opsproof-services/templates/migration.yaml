# Dependencies must exist and be ready before this chart is installed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 1800
  backoffLimit: 3
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: opsproof, opsproof.io/role: migration}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alembic
          image: {{ include "opsproof.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and (eq .Values.component "control") .Values.controlRdsTls.enabled }}
          command: ["python", "-m", "opsproof_control.db_bootstrap"]
          args: ["--mode", "migrate"]
          {{- else }}
          command: ["alembic"]
          args: ["upgrade", "head"]
          {{- end }}
          envFrom:
            - secretRef: {name: {{ if eq .Values.component "demo" }}opsproof-demo-runtime{{ else }}opsproof-control-runtime{{ end }}}
            {{- if and (eq .Values.component "control") .Values.controlRdsTls.enabled }}
            - secretRef: {name: opsproof-control-rds-migration-connection}
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 400m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if and (eq .Values.component "control") .Values.controlRdsTls.enabled }}
            - {name: rds-ca, mountPath: /etc/opsproof/rds-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if and (eq .Values.component "control") .Values.controlRdsTls.enabled }}
        - name: rds-ca
          configMap:
            name: {{ .Values.controlRdsTls.caConfigMapName | quote }}
            items: [{key: global-bundle.pem, path: global-bundle.pem}]
        {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
