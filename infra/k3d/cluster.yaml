# Local-only verification cluster. The server is schedulable to keep the
# minimum profile small. No cloud resources are created by this file.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: opsproof
image: rancher/k3s:v1.35.5-k3s1
servers: 1
agents: 0
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: "127.0.0.1:8081:30080"
    nodeFilters:
      - server:0
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3d:
    wait: true
    timeout: "600s" # first-run image downloads can exceed two minutes
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:0]
      - arg: --disable=servicelb
        nodeFilters: [server:0]
