name: Reliability and Measurement Contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.7'
          enable-cache: true
      - name: Python 3.14
        run: uv python install 3.14
      - name: Tooling lint and formatting
        run: |
          uv run --project apps/control-plane --locked ruff check --config apps/control-plane/pyproject.toml scripts conftest.py
          uv run --project apps/control-plane --locked ruff format --check --config apps/control-plane/pyproject.toml scripts conftest.py
      - name: Offline reliability contracts (never injects faults)
        env:
          PYTHONPATH: apps/control-plane/src
        run: uv run --project apps/control-plane --locked pytest scripts/reliability/tests -q
      - name: Offline cost and inventory guards
        run: uv run --project apps/control-plane --locked python -m unittest discover -s scripts/cloud/tests -v
      - name: Disposable PostgreSQL migration and concurrency safety (no Kubernetes)
        run: uv run --project apps/control-plane --locked python scripts/reliability/validate_postgres.py
      - name: Kubernetes route separator regression
        run: python3 -m unittest discover -s scripts/platform/tests -p 'test_kubernetes_route_registration.py' -v
      - name: Evidence fixture JSON validity
        run: |
          python3 -m json.tool benchmarks/ai/qualification_v1.json > /dev/null
          python3 -m json.tool docs/cloud/cost-estimate.example.json > /dev/null
      - name: Whitespace validation
        run: git diff --check
