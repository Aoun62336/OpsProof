name: Reliability and Measurement Contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.7'
          enable-cache: true
      - name: Python 3.14
        run: uv python install 3.14
      - name: Tooling lint and formatting
        run: |
          uv run --project apps/control-plane --locked ruff check --config apps/control-plane/pyproject.toml scripts conftest.py
          uv run --project apps/control-plane --locked ruff format --check --config apps/control-plane/pyproject.toml scripts conftest.py
      - name: Offline reliability contracts (never injects faults)
        run: uv run --project apps/control-plane --locked python -m pytest scripts/reliability/tests -q
      - name: Offline cost and inventory guards
        run: uv run --project apps/control-plane --locked python -m pytest scripts/cloud/tests -q
      - name: Disposable PostgreSQL migration and concurrency safety (no Kubernetes)
        run: uv run --project apps/control-plane --locked python scripts/reliability/validate_postgres.py
      - name: Kubernetes route separator regression
        run: uv run --project apps/control-plane --locked python -m pytest scripts/platform/tests/test_kubernetes_route_registration.py -v
      - name: Evidence fixture JSON validity
        run: |
          python3 -m json.tool benchmarks/ai/qualification_v1.json > /dev/null
          python3 -m json.tool docs/cloud/cost-input.example.json > /dev/null
      - name: Workflow source references and test discovery
        run: uv run --project apps/control-plane --locked python -m scripts.cloud.check_workflow_contracts
      - name: Whitespace validation
        run: git diff --check
