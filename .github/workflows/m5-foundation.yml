name: M5 Foundation Contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Install checksum-verified Helm
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error -O https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz
          curl --fail --location --silent --show-error -O https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.1.4-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.1.4-linux-amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/m5-bin"
          cp linux-amd64/helm "$RUNNER_TEMP/m5-bin/helm"
          echo "$RUNNER_TEMP/m5-bin" >> "$GITHUB_PATH"
      - name: Secret, resource and GitOps boundary contracts
        run: python3 -m unittest discover -s scripts/m5/tests -v
      - name: Helm lint, renders and offline Pod security contracts
        run: python3 scripts/m5/validate_charts.py
      - name: Pinned upstream Gateway chart schema and exposure contract
        run: python3 scripts/m5/validate_gateway.py
      - name: Whitespace validation
        run: git diff --check
