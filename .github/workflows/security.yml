name: Security Source Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan source and Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner="$(python3 -c 'from scripts.security_tools import binary; print(binary("gitleaks"))')"
          "$scanner" dir --redact=100 --no-banner .
          "$scanner" git --log-opts='--all --full-history -m' --redact=100 --no-banner .
      - name: Trivy filesystem vulnerability and IaC configuration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, verified upstream release commit
        with:
          scan-type: fs
          version: v0.76.2
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          cache: 'false'
