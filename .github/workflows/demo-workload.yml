name: Demo Workload Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python Quality and Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/demo-workload

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff formatting
        run: uv run --locked ruff format --check .

      - name: Unit tests
        run: uv run --locked pytest -v

  integration:
    name: Container Integration and Recovery
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"

      - name: Install Python
        run: uv python install 3.14

      - name: Generate temporary database password
        run: |
          python3 -c 'import secrets; print("OPSPROOF_DB_PASSWORD=" + secrets.token_urlsafe(24))' > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start workload
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: uv run --no-project --python 3.14 python scripts/verify_demo.py smoke

      - name: Worker outage and recovery
        run: bash scripts/verify_first_fault.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80

      - name: Clean up the temporary environment
        if: always()
        run: docker compose down --volumes --remove-orphans

