name: Platform Contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.7'
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install checksum-verified Helm
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error -O https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz
          curl --fail --location --silent --show-error -O https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.1.4-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.1.4-linux-amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/platform-bin"
          cp linux-amd64/helm "$RUNNER_TEMP/platform-bin/helm"
          echo "$RUNNER_TEMP/platform-bin" >> "$GITHUB_PATH"
      - name: Secret, resource and GitOps boundary contracts
        run: uv run --project apps/control-plane --locked --with PyYAML==6.0.3 python -m pytest scripts/platform/tests -v
      - name: Helm lint, renders and offline Pod security contracts
        run: uv run --project apps/control-plane --locked --with PyYAML==6.0.3 python -m scripts.platform.validate_charts
      - name: Pinned upstream Gateway chart schema and exposure contract
        run: uv run --project apps/control-plane --locked --with PyYAML==6.0.3 python -m scripts.platform.validate_gateway
      - name: Whitespace validation
        run: git diff --check
      - name: Pinned secret scanner and strict Kubernetes schemas
        run: uv run --project apps/control-plane --locked --with PyYAML==6.0.3 python -m scripts.platform.security_checks
