name: Approved GHCR Release
on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: 'I approve publication of reviewed main commit images to GHCR'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: opsproof-approved-release
  cancel-in-progress: false
jobs:
  review-and-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_approved == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv python install 3.14
      - name: Demo regression tests
        run: uv run --project apps/demo-workload --locked pytest apps/demo-workload/tests -q
      - name: Control regression tests
        run: uv run --project apps/control-plane --locked pytest apps/control-plane/tests -q
      - name: Platform and reliability contracts
        env:
          PYTHONPATH: apps/control-plane/src
        run: |
          python3 -m unittest discover -s scripts/platform/tests -v
          uv run --project apps/control-plane --locked pytest scripts/reliability/tests -q
          uv run --project apps/control-plane --locked python -m unittest discover -s scripts/cloud/tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Frontend static checks and build
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: k6 JavaScript syntax
        run: node --check benchmarks/k6/jobs.js
      - name: Secrets scan before image publication
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-scan-publish:
    needs: review-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_approved == true
    environment: opsproof-release # Configure protected reviewers externally before first release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: demo
            context: apps/demo-workload
            dockerfile: apps/demo-workload/Dockerfile
          - name: control
            context: apps/control-plane
            dockerfile: apps/control-plane/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: edge
            context: apps/edge-proof
            dockerfile: apps/edge-proof/Dockerfile
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Reviewed source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build once from reviewed commit
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/opsproof-${NAME}:${GITHUB_SHA}"
          docker build --pull --file "$DOCKERFILE" --tag "$image" "$CONTEXT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/opsproof-${NAME}" >> "$GITHUB_ENV"
      - name: Trivy image policy (must pass before publication)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          cache: 'false'
      - name: CycloneDX software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
          cache: 'false'
      - name: Publish exact scanned image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$RUNNER_TEMP/push.log" | tail -n 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'No verified push digest'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Release evidence digest record
        shell: bash
        env:
          ROLE: ${{ matrix.name }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "role": os.environ["ROLE"],
              "source_sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"].lower(),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "digest": os.environ["PUBLISHED_DIGEST"],
          }
          Path("release-evidence.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Retain digest receipt and SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.name }}
          path: |
            release-evidence.json
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
  assemble-release:
    needs: build-scan-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: .runtime/cloud/release-receipts
          merge-multiple: false
      - name: Assemble exact four-image release identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -m scripts.cloud.assemble_release_manifest \
            --receipts .runtime/cloud/release-receipts \
            --source-sha "$SOURCE_SHA" --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --output .runtime/cloud/release-manifest.json
          python3 -m scripts.cloud.verify_release_manifest --input .runtime/cloud/release-manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: approved-release-manifest
          path: .runtime/cloud/release-manifest.json
          if-no-files-found: error
          retention-days: 30
