version: 2

updates:
  - package-ecosystem: "uv"
    directories:
      - "/apps/demo-workload"
      - "/apps/control-plane"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 4

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directories:
      - "/apps/demo-workload"
      - "/apps/control-plane"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2
