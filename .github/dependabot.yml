version: 2

updates:
  - package-ecosystem: "uv"
    directories:
      - "/apps/demo-workload"
      - "/apps/control-plane"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 4

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directories:
      - "/apps/demo-workload"
      - "/apps/control-plane"
      - "/apps/web"
      - "/apps/edge-proof"
      - "/infra/emulator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
