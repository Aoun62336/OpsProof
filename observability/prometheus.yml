global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: opsproof-demo-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - opsproof-demo-api:8080

  - job_name: opsproof-control-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - opsproof-control-api:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
