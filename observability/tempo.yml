stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local

    wal:
      path: /var/tempo/wal

    local:
      path: /var/tempo/blocks

# Tempo 3.1.1 keeps the retention policy under the backend worker.
backend_worker:
  compaction:
    block_retention: 24h

usage_report:
  reporting_enabled: false
