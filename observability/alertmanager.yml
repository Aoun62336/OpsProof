global:
  resolve_timeout: 1m

route:
  receiver: opsproof-control-plane
  group_by:
    - alertname
    - job
    - instance
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 15m

receivers:
  - name: opsproof-control-plane
    webhook_configs:
      - url: http://opsproof-control-api:8080/api/v1/internal/alertmanager
        send_resolved: true

        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook-token
